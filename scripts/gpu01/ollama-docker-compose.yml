services:
  # ollama — EMBED plane. Serves nomic-embed-text / bge-m3 embeddings for
  # every client (omoikane notrf01dmz02/06 litellm, nltg01,
  # defra01agri01, the gateway). Since 2026-08-26 NO generate traffic may
  # land here: the Ollama 0.32.15 scheduler wedges when a generate that does
  # not fit tries to evict the embed runner, which never goes idle under the
  # continuous omoikane stream (all generates then hang forever while embeds
  # keep answering). Gateway generates go to ollama-gen (:11441) below.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    volumes:
      - /srv/ollama/ollama_state:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ollama-gen — GENERATE plane (gateway-only: llm-judge, RAG synth/rewrite/
  # json, teacher, extraction, doc-chain). Split off 2026-08-26 after two
  # scheduler wedges (see above). Evictions here only ever target idle LLM
  # runners, so the deadlock cannot occur. Same image + model store; VRAM is
  # shared through the driver like any other tenant. ctx 4096 caps a stray
  # no-num_ctx gemma3:12b request at ~7.7 GiB instead of 10.4.
  ollama-gen:
    image: ollama/ollama:latest
    container_name: ollama-gen
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0:11441
      - OLLAMA_ORIGINS=*
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    volumes:
      - /srv/ollama/ollama_state:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  anthropic-shim:
    image: python:3.12-slim
    container_name: anthropic-shim
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=ollama"
    environment:
      - SHIM_PORT=11435
      - OLLAMA_UPSTREAM=http://127.0.0.1:11434
    volumes:
      - ./anthropic_shim.py:/app/anthropic_shim.py:ro
    command: ["python3", "/app/anthropic_shim.py"]
    restart: unless-stopped
    depends_on:
      - ollama

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    labels:
      - "com.centurylinklabs.watchtower.scope=ollama"
    command:
      - --scope=ollama
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    restart: unless-stopped
