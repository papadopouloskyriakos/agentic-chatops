# promtool unit tests for freedom-ont-autoheal.yml (run by scripts/qa/suites/test-726-prom-alert-rules.sh)
# exp_annotations are generated from the rule file (they must match promtool's expansion exactly).
rule_files:
- freedom-ont-autoheal.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: freedom_ont_autoheal_wedged{instance="nl-claude01"}
    values: 0 1x12
  - series: freedom_ont_autoheal_last_run_timestamp{instance="nl-claude01"}
    values: 0+60x12
  alert_rule_test:
  - eval_time: 5m
    alertname: FreedomOntWedged
    exp_alerts: []
  - eval_time: 12m
    alertname: FreedomOntWedged
    exp_alerts:
    - exp_labels:
        severity: warning
        category: wan-freedom
        instance: nl-claude01
      exp_annotations:
        summary: Freedom ONT powered but dark on nl-sw01 Gi1/0/36
        description: 'nl-sw01 Gi1/0/36 (Freedom ONT) has been notconnect with PoE on for 10+ min and nl-fw01 Track 1 is not Up — the post-power-loss wedge. If the auto-heal is armed it PoE-cycles the port itself; if freedom_ont_autoheal_suppressed is 1 (maintenance window, chaos, shadow, or disarmed) run the recipe by hand: interface Gi1/0/36 / power inline never / wait 15 s / power inline auto / shutdown / no shutdown. Runbook: docs/runbooks/freedom-ont-autoheal.md.'
- interval: 1m
  input_series:
  - series: freedom_ont_autoheal_failure_open{instance="nl-claude01"}
    values: 1x10 0x10
  - series: freedom_ont_autoheal_last_run_timestamp{instance="nl-claude01"}
    values: 0+60x20
  alert_rule_test:
  - eval_time: 7m
    alertname: FreedomOntAutohealFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        category: wan-freedom
        instance: nl-claude01
      exp_annotations:
        summary: Freedom ONT auto-heal did not restore Freedom
        description: 'freedom-ont-heal.py PoE-cycled nl-sw01 Gi1/0/36 but the link and/or nl-fw01 Track 1 did not come back, and Freedom has not been seen healthy since. Check freedom_ont_autoheal_last_link_restored: 1 = ONT link is back, PPPoE/BRAS is the problem; 0 = the ONT is still dark. Runbook: docs/runbooks/freedom-ont-autoheal.md.'
  - eval_time: 15m
    alertname: FreedomOntAutohealFailed
    exp_alerts: []
- interval: 1m
  input_series:
  - series: freedom_ont_autoheal_escalations_total{instance="nl-claude01"}
    values: 0 0 0 1 1 1
  - series: freedom_ont_autoheal_last_run_timestamp{instance="nl-claude01"}
    values: 0+60x5
  alert_rule_test:
  - eval_time: 4m
    alertname: FreedomOntAutohealEscalated
    exp_alerts:
    - exp_labels:
        severity: critical
        category: wan-freedom
        instance: nl-claude01
      exp_annotations:
        summary: Freedom ONT auto-heal escalated to a human
        description: 'The cap of 3 PoE cycles per 24 h was reached with the ONT still powered but dark, or a PoE restore failed (the port may be left with PoE OFF — run `power inline auto` on nl-sw01 Gi1/0/36). The heal will not retry. Runbook: docs/runbooks/freedom-ont-autoheal.md.'
- interval: 1m
  input_series:
  - series: freedom_ont_autoheal_last_run_timestamp{instance="nl-claude01"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 5m
    alertname: FreedomOntAutohealStale
    exp_alerts: []
  - eval_time: 30m
    alertname: FreedomOntAutohealStale
    exp_alerts:
    - exp_labels:
        severity: warning
        category: wan-freedom
        instance: nl-claude01
      exp_annotations:
        summary: Freedom ONT detector/auto-heal has not run in 15+ min
        description: freedom_ont_autoheal.prom on nl-claude01 is stale or missing — the Cronicle job freedom-ont-heal (*/2) is broken, so FreedomOntWedged can no longer fire.
